(() => {
'use strict';
const LotteryEngine = (() => {
/** 宝くじ極: exact combinatorics, validated records, and transparent number selection. */
const OFFICIAL = 'https://www.takarakuji-official.jp/brand/suji/';

function combination(n, k) {
  if (!Number.isSafeInteger(n) || !Number.isSafeInteger(k) || n < 0 || k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let value = 1;
  for (let i = 1; i <= k; i++) value = value * (n - k + i) / i;
  return Math.round(value);
}

const GAMES = Object.freeze({
  loto7: { id: 'loto7', name: 'ロト7', short: 'LOTO 7', type: 'loto', max: 37, count: 7, price: 300, days: '毎週金曜', bonusCount: 2, sourceUrl: `${OFFICIAL}lineup-loto7/`, total: combination(37, 7) },
  loto6: { id: 'loto6', name: 'ロト6', short: 'LOTO 6', type: 'loto', max: 43, count: 6, price: 200, days: '毎週月・木曜', bonusCount: 1, sourceUrl: `${OFFICIAL}lineup-loto6/`, total: combination(43, 6) },
  mini: { id: 'mini', name: 'ミニロト', short: 'MINI LOTO', type: 'loto', max: 31, count: 5, price: 200, days: '毎週火曜', bonusCount: 1, sourceUrl: `${OFFICIAL}lineup-miniloto/`, total: combination(31, 5) },
  numbers3: { id: 'numbers3', name: 'ナンバーズ3', short: 'NUMBERS 3', type: 'numbers', max: 9, count: 3, price: 200, days: '月〜金曜（年末年始を除く）', bonusCount: 0, sourceUrl: `${OFFICIAL}lineup-numbers3/`, total: 1000 },
  numbers4: { id: 'numbers4', name: 'ナンバーズ4', short: 'NUMBERS 4', type: 'numbers', max: 9, count: 4, price: 200, days: '月〜金曜（年末年始を除く）', bonusCount: 0, sourceUrl: `${OFFICIAL}lineup-numbers4/`, total: 10000 },
  bingo5: { id: 'bingo5', name: 'ビンゴ5', short: 'BINGO 5', type: 'bingo', max: 40, count: 8, price: 200, days: '毎週水曜', bonusCount: 0, sourceUrl: `${OFFICIAL}lineup-bingo5/`, total: 5 ** 8 }
});

function gameFor(id) {
  if (!Object.hasOwn(GAMES, id)) throw new Error('対応していない宝くじです。');
  return GAMES[id];
}
function fail(message) { return { valid: false, error: message }; }
function integerArray(values) { return Array.isArray(values) && values.every(Number.isSafeInteger); }

function validateNumbers(gameId, numbers, { bonus = false } = {}) {
  const game = gameFor(gameId);
  const length = bonus ? game.bonusCount : game.count;
  if (!integerArray(numbers)) return fail('数字は整数で入力してください。');
  if (numbers.length !== length) return fail(`${bonus ? 'ボーナス数字' : '数字'}を${length}個入力してください。`);
  const min = game.type === 'numbers' ? 0 : 1;
  if (numbers.some(n => n < min || n > game.max)) return fail(`${min}〜${game.max}の数字を入力してください。`);
  if (game.type !== 'numbers' && new Set(numbers).size !== numbers.length) return fail('同じ数字を重複して入力できません。');
  if (game.type === 'bingo' && !bonus && numbers.some((n, i) => n < i * 5 + 1 || n > i * 5 + 5)) return fail('ビンゴ5は各マスの5個の数字から1個ずつ選んでください。');
  return { valid: true, error: '' };
}
function validateDraw(gameId, draw) {
  if (!draw || typeof draw !== 'object') throw new Error('抽せん結果を入力してください。');
  const main = validateNumbers(gameId, draw.numbers);
  if (!main.valid) throw new Error(`本数字：${main.error}`);
  const bonus = draw.bonus ?? [];
  const checked = validateNumbers(gameId, bonus, { bonus: true });
  if (!checked.valid) throw new Error(checked.error);
  if (bonus.some(n => draw.numbers.includes(n))) throw new Error('本数字とボーナス数字を重複させることはできません。');
}
function validatePlay(game, playType) {
  const allowed = game.id === 'numbers3' ? ['straight', 'box', 'set', 'mini'] : ['straight', 'box', 'set'];
  if (game.type === 'numbers' && !allowed.includes(playType)) throw new Error('この宝くじには指定の買い方がありません。');
}
function validateTicket(gameId, ticket, playType) {

function renderOddChart(draws) {
  const counts=Array.from({length:game().count+1},()=>0);draws.forEach(r=>counts[r.numbers.filter(n=>n%2).length]++);
  const max=Math.max(1,...counts),W=540,H=210,base=172,bw=340/counts.length,gap=150/counts.length;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="奇数の個数別の抽せん回数。${counts.map((n,i)=>`奇数${i}個が${n}回`).join('、')}"><line x1="28" y1="${base}" x2="518" y2="${base}" stroke="#dce5df"/>${counts.map((c,i)=>{const x=32+i*(bw+gap),h=c/max*118;return `<rect x="${x}" y="${base-h}" width="${bw}" height="${Math.max(h,2)}" rx="5" fill="${i===Math.floor(game().count/2)?'#b9d970':'#28745d'}"/><text x="${x+bw/2}" y="${base-h-10}" text-anchor="middle" fill="#315248" font-size="16">${c}</text><text x="${x+bw/2}" y="198" text-anchor="middle" fill="#61746a" font-size="16">${i}個</text>`}).join('')}</svg></div>`;
}

function renderLearn() {

    <section class="dark-card learning-hero"><div class="eyebrow">THE ESSENTIAL</div><h2>未来の当せん番号を、<br>確実に知る方法はありません。</h2><p>公平で独立した抽せんでは、どの組合せも同じ確率で選ばれます。過去データの分析は記録を理解する道具です。このアプリは「当たりやすい番号」やAIによる的中率を提示しません。</p></section>
    <div class="learn-grid"><section class="card learn-card"><span class="learn-icon">${icon('spark')}</span><h2>ランダムで選ぶ</h2><p>ブラウザの暗号学的乱数を使い、設定条件を満たす番号から無作為に選びます。ロト・ビンゴ5・ナンバーズのストレートでは、条件を指定しなければ各組合せを等しく扱います。ボックスでは元となる並び順から抽出するため、重複の少ない数字の組合せほど選ばれやすくなります。</p></section><section class="card learn-card"><span class="learn-icon">${icon('chart')}</span><h2>バランスで選ぶ</h2><p>奇数・偶数の個数を半数程度に整えます。ロトでは合計も中央付近に絞ります。見た目や好みに合わせる選び方で、1口の当せん確率を上げる機能ではありません。指定条件と両立しない場合は、その条件では作成できないことを表示します。</p></section><section class="card learn-card"><span class="learn-icon">${icon('grid')}</span><h2>分散で選ぶ</h2><p>同時に作る候補同士で数字が重なる量を抑えます。いずれの方式も、同じ番号の組合せは1回の作成内で重複しません。各1口の当せん確率は同じです。</p></section></div>
    <section class="card card-pad"><div class="card-heading"><h2>6種類のルールと確率</h2><span class="badge">公式ルール参照</span></div><div class="data-table-wrap"><table class="data-table probability-table"><thead><tr><th>宝くじ</th><th>数字の選び方</th><th>1口</th><th>通常の抽せん曜日</th><th>最上位一致の確率</th></tr></thead><tbody>${Object.values(GAMES).map(g=>`<tr><td><a href="${g.sourceUrl}" target="_blank" rel="noopener noreferrer">${g.name}</a></td><td>${g.type==='loto'?`1〜${g.max}から${g.count}個`:g.type==='numbers'?`${g.count}桁・ストレート`:'8マスで各5択'}</td><td>${yen(g.price)}</td><td>${esc(g.days)}</td><td>1 / ${nf(g.total)}</td></tr>`).join('')}</tbody></table></div><p class="inline-note">ロト・ビンゴ5は1等、ナンバーズはストレートの確率。年末年始などの開催は公式発表をご確認ください。ボックス・セットは数字の重複によって確率が変わります。</p></section>
    <section class="card card-pad probability-calculator"><div class="card-heading"><h2>${icon('chart')}確率を計算してみる</h2><span class="badge neutral">理論値</span></div><p>同じ回に異なる番号を購入し、それを複数回続けたとき、少なくとも一度最上位に一致する確率です。</p><div class="advanced-grid"><div class="field"><label for="prob-game">宝くじ</label><select id="prob-game">${Object.values(GAMES).map(g=>`<option value="${g.id}" ${ui.game===g.id?'selected':''}>${g.name}${g.type==='numbers'?'（ストレート）':''}</option>`).join('')}</select></div><div class="field"><label for="prob-tickets">1回あたりの異なる口数</label><input id="prob-tickets" type="number" min="1" max="100" value="1"></div><div class="field"><label for="prob-draws">抽せんの回数</label><input id="prob-draws" type="number" min="1" max="10000" value="1"></div></div><div id="prob-output" class="prob-output" aria-live="polite"></div><div class="formula">1 − (1 − 異なる口数 ÷ 全組合せ数)<sup>抽せん回数</sup></div><p class="inline-note">毎回が独立・公平な抽せんである前提です。同じ回で同一番号を複数購入しても、一致する確率は増えません。支出の試算も同時に表示します。</p></section>
    <section class="card card-pad"><div class="card-heading"><h2>使い方・よくある質問</h2></div><div class="faq-list"><details open><summary>最初は何をすればいいですか？</summary><p>「番号をつくる」で宝くじの種類を選び、作成ボタンを押してください。気に入った候補は保存できます。購入したら「購入ノート」で購入済みに変更し、抽せん後は「当せんを照合」を使います。</p></details><details><summary>過去に出なかった数字は、そろそろ出ますか？</summary><p>公平で独立した抽せんでは、未出現期間が長いことを理由に、次回の出現確率が上がることはありません。出現回数マップは、あくまでその期間を振り返るものです。</p></details><details><summary>ナンバーズのボックスとセットの違いは？</summary><p>ボックスは数字の並び順を問いません。セットはストレートとボックスに半額ずつ申し込む方法です。同じ数字の重複によって並べ替えの種類数が変わるので、ボックスの当せん確率は番号ごとに異なります。すべて同じ数字はボックス・セットでは申し込めません。</p></details><details><summary>抽せん結果は自動で更新されますか？</summary><p>自動更新ではありません。初期収録データは${official.updatedAt?prettyDate(official.updatedAt.slice(0,10)):'作成時'}時点に公式から確認した各40回分です。CSVで追加でき、収録データの最新日と出典をいつでも確認できます。</p></details><details><summary>スマホとPCで記録は共通ですか？</summary><p>記録はそれぞれのブラウザに保存され、自動同期はしません。「設定・バックアップ」でJSONを保存し、別の端末に読み込むと移せます。復元時は同じ記録IDを更新し、ほかの記録を残して統合します。</p></details><details><summary>ジャンボやスクラッチには対応していますか？</summary><p>このアプリは、自分で番号を選ぶ6種類が対象です。あらかじめ番号が決まっているジャンボやスクラッチの当たり券を見分ける機能はありません。</p></details></div></section>

function updateProbability() {
  const el=$('#prob-output');if(!el)return;

  if(!Number.isInteger(n)||n<1||n>100||!Number.isInteger(d)||d<1||d>10000){el.innerHTML='<p class="input-error">口数は1〜100、抽せん回数は1〜10,000の整数で入力してください。</p>';return;}

  el.innerHTML=`<div><span>${g.type==='numbers'?'ストレート':'1等'}に一度以上一致する確率</span><strong>${(p*100).toLocaleString('ja-JP',{maximumFractionDigits:8,minimumFractionDigits:2})}<small>%</small></strong></div><div><span>支出の合計</span><strong>${yen(g.price*n*d)}</strong></div><p>${nf(n)}口 × ${nf(d)}回。この計算は当せんの保証や予測ではありません。</p>`;
}

function parseNumbers(text,id=ui.game) {

function mergeDraws(rows) {
  const result=new Map(), byRound=new Map(), byDate=new Map();let sequence=0;
  for(const r of rows){
    const item={...r,round:r.round?String(Number(r.round)):''};
    const stale=new Set([item.round?byRound.get(item.round):undefined,byDate.get(item.date)]);
    for(const key of stale){if(key===undefined)continue;const old=result.get(key);if(!old)continue;if(old.round&&byRound.get(old.round)===key)byRound.delete(old.round);if(byDate.get(old.date)===key)byDate.delete(old.date);result.delete(key);}
    const key=sequence++;result.set(key,item);if(item.round)byRound.set(item.round,key);byDate.set(item.date,key);
  }
  return [...result.values()];
}

  try{
    const el=e.target;
    if(['draw-selector','check-play-type','draw-numbers','draw-bonus','your-numbers'].includes(el.id)){ui.checkResult=null;const output=$('#check-output');if(output)output.innerHTML='';}
    if(el.id==='play-type'){readOptions();ui.tickets=[];render();}
    if(el.id==='ticket-count'){readOptions();$('#generation-cost').textContent=yen(game().price*ui.count);}
    if(['odd-count','sum-min','sum-max','no-consecutive'].includes(el.id)){readOptions();ui.tickets=[];$('#ticket-results').innerHTML=renderTickets();const countBadge=$('.results-panel .badge');if(countBadge)countBadge.textContent='0 口';}
    if(el.id==='analysis-period'){ui.period=Number(el.value);render();}
    if(el.id==='analysis-sort'){ui.sort=el.value;render();}
    if(el.id==='record-game'){ui.recordGame=el.value;render();}
    if(el.id==='data-game'){ui.checkResult=null;ui.game=el.value;ui.playType='straight';ui.tickets=[];ui.fixed=[];ui.excluded=[];ui.odd='';ui.sumMin='';ui.sumMax='';ui.noConsecutive=false;db.game=ui.game;persist();}
    if(el.id==='draw-selector'){
      if(el.value===''){$('#draw-numbers').value='';if($('#draw-bonus'))$('#draw-bonus').value='';$('#selected-draw-info').textContent='公式発表の数字を入力してください。';return;}
      const d=allDraws()[Number(el.value)];$('#draw-numbers').value=game().type==='numbers'?d.numbers.join(''):d.numbers.join(' ');if($('#draw-bonus'))$('#draw-bonus').value=d.bonus.join(' ');
      $('#selected-draw-info').innerHTML=`${prettyDate(d.date)} 抽せん · ${d.custom?'取込データ':`みずほ銀行公式データ <a href="${esc(d.sourceUrl||game().sourceUrl)}" target="_blank" rel="noopener noreferrer">出典を確認</a>`}`;
    }
    if(el.id==='check-play-type'){ui.tickets=[];ui.playType=el.value;$('#your-numbers').placeholder=numbersHint(true);$('#your-numbers').value='';}
    if(el.id==='manual-game')showManualTicket(el.value);
    if(el.id==='manual-type')showManualTicket($('#manual-game').value,el.value);
    if(el.id.startsWith('prob-'))updateProbability();
  }catch(error){reportError(error);}
});
document.addEventListener('input',e=>{if(e.target.id.startsWith('prob-'))updateProbability();if(['draw-numbers','draw-bonus','your-numbers'].includes(e.target.id)){ui.checkResult=null;const output=$('#check-output');if(output)output.innerHTML='';}});
$('#csv-file').addEventListener('change',async e=>{
  try{const file=e.target.files[0];if(!file)return;if(file.size>4000000)throw new Error('CSVは4MB以内にしてください。');const id=e.target.dataset.game||ui.game,rows=parseDrawCSV(id,await file.text()).map(r=>validateDraw(id,r,true)),merged=mergeDraws([...(db.customDraws[id]||[]),...rows]);if(merged.length>20000)throw new Error('収録は種類ごとに20,000回までです。');db.customDraws[id]=merged;persist();dialog.close();render();toast(`${rows.length}回の結果を取り込みました。`);}catch(error){reportError(error);}
});
$('#backup-file').addEventListener('change',async e=>{
  try{const file=e.target.files[0];if(!file)return;if(file.size>15000000)throw new Error('バックアップは15MB以内にしてください。');const incoming=normalizeBackup(JSON.parse(await file.text()));window.__pendingBackup=incoming;showDialog('バックアップを読み込みますか？',`<p>番号記録 <strong>${incoming.records.length}件</strong> と抽せんデータを、現在の記録に統合します。同じIDの記録はファイルの内容に更新します。</p><p>月予算を${yen(incoming.budget)}に変更します。現在の別IDの記録は残ります。</p><p id="dialog-error" class="input-error" role="alert"></p>`,`<button class="secondary-button" data-action="close-dialog">キャンセル</button><button class="primary-button" data-action="confirm-backup">読み込んで統合</button>`);}catch(error){reportError(error);}
});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
window.addEventListener('hashchange',()=>{navigate(location.hash.slice(1));updateProbability();});
window.addEventListener('popstate',()=>{navigate(location.hash.slice(1));updateProbability();});
$('#settings-button').innerHTML=icon('settings');
$('#today-label').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
async function init(){
  try{const data=EMBEDDED_OFFICIAL_DRAWS;official={...data,games:{}};for(const id of Object.keys(GAMES)){official.games[id]=(data.games[id]||[]).map(row=>validateDraw(id,row));}}catch{official={games:{},updatedAt:null};toast('埋め込みデータを読み込めませんでした。HTMLファイルをダウンロードし直してください。');}
  try{ui.tickets=generateTickets(ui.game,{count:ui.count,strategy:'random'});}catch(error){toast(error.message);}
  ui.view=NAV.some(n=>n.id===location.hash.slice(1))?location.hash.slice(1):'generate';render();updateProbability();
}
init();

})();
</script>
